name: Checks

# Reusable workflow: the single source of truth for our quality gate. Called by ci.yml (on PRs) and
# by deploy.yml's verify job (on pushes to main).
on:
  workflow_call:

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive terraform
      # -backend=false: validate syntax/providers without touching remote state (no AWS creds here).
      - name: Validate main stack
        working-directory: terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate bootstrap stack
        working-directory: terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
