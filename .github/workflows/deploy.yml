name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:
  # Quality gate (shared with ci.yml) — the deploy job will not run unless this passes.
  verify:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy to AWS
    needs: verify # ← deploy only runs if verify succeeds
    runs-on: ubuntu-latest
    environment: production
    # OIDC: assume an AWS role rather than storing long-lived keys.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          # Plain stdout so `terraform output -raw` can be captured below.
          terraform_wrapper: false

      # Provisions/updates the bucket + CloudFront (+ custom domain, if configured). Non-secret
      # config is auto-loaded from terraform/prod.auto.tfvars; this stack has no secrets.
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform apply -input=false -auto-approve

      - name: Read Terraform outputs
        id: tf
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "dist_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"

      # Hashed build assets (dist/assets/*) never change content under the same name, so they're
      # cached for a year. Everything else (index.html, favicon, robots.txt) keeps a stable name, so
      # it's served no-cache and always revalidated.
      - name: Sync site to S3
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          # 1. New hashed assets first, so the new index.html never references a missing file.
          aws s3 sync frontend/dist/assets "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # 2. Stable-named files (incl. index.html); prune any that were removed from the build.
          aws s3 sync frontend/dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ steps.tf.outputs.dist_id }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" \
            --query 'Invalidation.Id' --output text)
          # Block until edges have dropped the old files, so "deployed" means visible.
          aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$id"

      # Remove hashed assets from older builds only after the invalidation, so visitors still on the
      # previous index.html don't hit missing chunks mid-deploy.
      - name: Prune old assets
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          aws s3 sync frontend/dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Summary
        run: echo "🚀 Deployed to ${{ steps.tf.outputs.site_url }}" >> "$GITHUB_STEP_SUMMARY"
