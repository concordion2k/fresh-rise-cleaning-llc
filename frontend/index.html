<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F6B3A" />
    <meta
      name="description"
      content="FreshRise Cleaning — family owned carpet, upholstery and area rug cleaning serving the Four Corners, FL area. Clear room-based pricing and free quotes."
    />
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a light flash in dark mode.
      // Mirrors src/composables/useTheme.ts.
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>FreshRise Cleaning — Carpet, Upholstery &amp; Area Rugs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
